name: releasectl
description: Plan and apply your App Store Connect and Google Play catalog and listing from YAML. Store keys are passed as env from your secrets and go only to the stores.
author: releasectl-dev

inputs:
  command:
    description: iap-plan / iap-apply / iap-retire-plan / iap-retire (purchase catalog), meta-plan / meta-apply / meta-export (store listing; export only prints what the stores have now as JSON)
    default: iap-plan
  config:
    description: Path to the desired-state YAML (iap.yaml for the purchase catalog, metadata.yaml for the store listing)
    default: iap.yaml
  only:
    description: Providers to run, comma-separated (appstore,googleplay). Empty runs all
    default: ""
  app-store-version:
    description: For meta-plan / meta-apply, the App Store version to edit ("1.4.0"); overrides appStoreVersion in metadata.yaml. For meta-export, the version to export ("live" or a version string)
    default: ""
  create-app-store-version:
    description: For meta-plan / meta-apply, create that App Store version if it does not exist (plan only shows it). Needs app-store-version or appStoreVersion
    default: "false"
  comment:
    description: Comment the result on the pull request (on push, on the pull request the commit came from)
    default: "true"
  github-token:
    description: Token used for comments and Issues
    default: ${{ github.token }}
  drift-issue:
    description: Report plan changes as an Issue (for scheduled runs). Opens one when the store drifts, updates it only when the changes differ, and closes it when the store is back in sync
    default: "false"

outputs:
  exitcode:
    description: 0 no changes / 2 changes pending / 1 errors
    value: ${{ steps.run.outputs.exitcode }}
  has-changes:
    description: true / false
    value: ${{ steps.run.outputs.has-changes }}
  json:
    description: Path to the JSON report file
    value: ${{ steps.run.outputs.json }}

runs:
  using: composite
  steps:
    # Builds the CLI from the source at the ref given in `uses:`.
    - name: Cache releasectl build
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ${{ runner.temp }}/releasectl-target
        key: releasectl-${{ runner.os }}-${{ github.action_ref || github.sha }}
        restore-keys: releasectl-${{ runner.os }}-

    - name: Install releasectl
      shell: bash
      env:
        CARGO_TARGET_DIR: ${{ runner.temp }}/releasectl-target
      run: |
        set -euo pipefail
        rustup toolchain install stable --profile minimal --no-self-update >/dev/null
        cargo +stable install --locked --quiet --path "$GITHUB_ACTION_PATH/crates/cli" --root "$RUNNER_TEMP/releasectl"
        echo "$RUNNER_TEMP/releasectl/bin" >> "$GITHUB_PATH"

    - name: releasectl ${{ inputs.command }}
      id: run
      shell: bash
      env:
        RC_COMMAND: ${{ inputs.command }}
        RC_CONFIG: ${{ inputs.config }}
        RC_ONLY: ${{ inputs.only }}
        RC_ASC_VERSION: ${{ inputs.app-store-version }}
        RC_ASC_CREATE: ${{ inputs.create-app-store-version }}
      run: |
        set -uo pipefail
        case "$RC_COMMAND" in
          iap-plan|iap-apply|iap-retire-plan|iap-retire) sub=(iap "${RC_COMMAND#iap-}") ;;
          meta-plan|meta-apply|meta-export) sub=(meta "${RC_COMMAND#meta-}") ;;
          plan|apply|retire-plan|retire)
            echo "::error::command: $RC_COMMAND was renamed to iap-$RC_COMMAND in v0.6.0"; exit 1 ;;
          *) echo "::error::unknown command: $RC_COMMAND"; exit 1 ;;
        esac
        json="$RUNNER_TEMP/releasectl.json"; md="$RUNNER_TEMP/releasectl.md"
        if [ "$RC_COMMAND" = meta-export ]; then
          # Only prints what the stores have now as JSON: no diff and no Markdown.
          [ "$RC_ASC_CREATE" = true ] && { echo "::error::create-app-store-version cannot be used with meta-export"; exit 1; }
          args=("${sub[@]}" --config "$RC_CONFIG" --json-out "$json")
        else
          args=("${sub[@]}" --config "$RC_CONFIG" --detailed-exitcode --json-out "$json" --markdown-out "$md")
        fi
        [ -n "$RC_ONLY" ] && args+=(--only "$RC_ONLY")
        if [ "$RC_COMMAND" = meta-export ]; then
          [ -n "$RC_ASC_VERSION" ] && args+=(--app-store-version "$RC_ASC_VERSION")
        elif [ "${sub[0]}" = meta ]; then
          [ -n "$RC_ASC_VERSION" ] && args+=(--app-store-version "$RC_ASC_VERSION")
          [ "$RC_ASC_CREATE" = true ] && args+=(--create-app-store-version)
        elif [ -n "$RC_ASC_VERSION" ] || [ "$RC_ASC_CREATE" = true ]; then
          echo "::error::app-store-version / create-app-store-version can only be used with meta-* commands"; exit 1
        fi
        # The keys stay in the environment for the CLI. This script never reads or logs them.
        # Actions starts bash with -e, so capture the exit code: 2 (changes pending) must not stop the step.
        code=0
        if [ "$RC_COMMAND" = meta-export ]; then
          releasectl "${args[@]}" > /dev/null || code=$?
        else
          releasectl "${args[@]}" || code=$?
        fi
        [ -f "$md" ] && cat "$md" >> "$GITHUB_STEP_SUMMARY"
        echo "exitcode=$code" >> "$GITHUB_OUTPUT"
        echo "has-changes=$([ "$code" = 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        echo "json=$json" >> "$GITHUB_OUTPUT"
        [ -f "$md" ] && echo "markdown=$md" >> "$GITHUB_OUTPUT"
        # 2 (changes pending) is a success; only 1 (errors) fails. Fail later, so the comment is still posted.
        exit 0

    - name: Comment on the pull request
      # Only on pull_request and push, so a scheduled run does not comment on the pull request of the latest commit.
      if: inputs.comment == 'true' && steps.run.outputs.markdown != '' && (github.event_name == 'pull_request' || github.event_name == 'push')
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        RC_COMMAND: ${{ inputs.command }}
        RC_MD: ${{ steps.run.outputs.markdown }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        [ -f "$RC_MD" ] || exit 0
        repo="$GITHUB_REPOSITORY"
        marker="<!-- releasectl:$RC_COMMAND -->"
        if [ -n "${PR_NUMBER:-}" ]; then
          # Pull request: keep one comment with the marker and rewrite it (sticky).
          id=$(gh api "repos/$repo/issues/$PR_NUMBER/comments" --paginate \
                 --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$repo/issues/comments/$id" -F body=@"$RC_MD" >/dev/null
          else
            gh api -X POST "repos/$repo/issues/$PR_NUMBER/comments" -F body=@"$RC_MD" >/dev/null
          fi
        else
          # Push: add the result to the pull request that contains the commit (job summary only when there is none).
          pr=$(gh api "repos/$repo/commits/$GITHUB_SHA/pulls" --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "$pr" ]; then
            gh api -X POST "repos/$repo/issues/$pr/comments" -F body=@"$RC_MD" >/dev/null
          fi
        fi

    - name: Drift issue
      if: inputs.drift-issue == 'true' && (inputs.command == 'iap-plan' || inputs.command == 'meta-plan') && (steps.run.outputs.exitcode == '0' || steps.run.outputs.exitcode == '2')
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        RC_CONFIG: ${{ inputs.config }}
        RC_MD: ${{ steps.run.outputs.markdown }}
        RC_CODE: ${{ steps.run.outputs.exitcode }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail
        repo="$GITHUB_REPOSITORY"
        label=releasectl-drift
        marker="<!-- releasectl:drift:$RC_CONFIG -->"
        issue=$(gh issue list -R "$repo" --state open --label "$label" --limit 100 --json number,body \
                  --jq "map(select(.body | startswith(\"$marker\"))) | .[0].number // empty" 2>/dev/null || true)

        if [ "$RC_CODE" = 0 ]; then
          if [ -n "$issue" ]; then
            gh issue comment "$issue" -R "$repo" --body "✅ Resolved: the plan shows no changes. $RUN_URL" >/dev/null
            gh issue close "$issue" -R "$repo" >/dev/null
            echo "closed drift issue #$issue"
          fi
          exit 0
        fi

        # Body = marker + the plan's Markdown (without the plan's own marker line). The trailing "Detected:" part is not compared.
        content="$RUNNER_TEMP/drift-content.md"; body="$RUNNER_TEMP/drift-body.md"
        { echo "$marker"; tail -n +2 "$RC_MD"; } > "$content"
        { cat "$content"; echo; echo "---"; echo "Detected: $RUN_URL ($(date -u +%Y-%m-%dT%H:%MZ))"; } > "$body"

        if [ -z "$issue" ]; then
          gh label create "$label" -R "$repo" --color D93F0B --description "releasectl: the store differs from the desired state" --force >/dev/null
          url=$(gh issue create -R "$repo" --title "releasectl: the store has drifted from $RC_CONFIG" --label "$label" --body-file "$body")
          echo "opened drift issue: $url"
          exit 0
        fi
        old="$RUNNER_TEMP/drift-old.md"
        gh issue view "$issue" -R "$repo" --json body --jq .body | sed '/^---$/,$d' > "$old"
        # Ignore differences in trailing blank lines.
        if diff -q <(sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' "$old") <(sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' "$content") >/dev/null; then
          echo "drift issue #$issue: unchanged since the last run"
        else
          gh issue edit "$issue" -R "$repo" --body-file "$body" >/dev/null
          gh issue comment "$issue" -R "$repo" --body "🔄 The drift has changed. $RUN_URL" >/dev/null
          echo "updated drift issue #$issue"
        fi

    - name: Fail on error
      if: steps.run.outputs.exitcode == '1'
      shell: bash
      run: |
        echo "::error::releasectl ${{ inputs.command }} reported errors (see the job summary)"
        exit 1
