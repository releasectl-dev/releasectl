name: releasectl
description: App Store Connect / Google Play の課金カタログを iap.yaml から plan / apply する（鍵は Secrets から env で渡す）
author: releasectl-dev

inputs:
  command:
    description: iap-plan / iap-apply / iap-retire-plan / iap-retire（課金カタログ）、meta-plan / meta-apply（掲載情報）
    default: iap-plan
  config:
    description: desired-state の YAML（課金カタログは iap.yaml、掲載情報は metadata.yaml など）
    default: iap.yaml
  only:
    description: provider を絞る（appstore,googleplay）。空なら全部
    default: ""
  comment:
    description: PR にコメントする（push のときは、その commit の PR に結果を付ける）
    default: "true"
  github-token:
    description: コメント・Issue に使うトークン
    default: ${{ github.token }}
  drift-issue:
    description: plan の差分を Issue で知らせる（定期実行用。差分があれば開いて内容が変わったときだけ更新、消えたら閉じる）
    default: "false"

outputs:
  exitcode:
    description: 0 差分なし / 2 差分あり / 1 エラー
    value: ${{ steps.run.outputs.exitcode }}
  has-changes:
    description: true / false
    value: ${{ steps.run.outputs.has-changes }}
  json:
    description: -o json の結果のファイルのパス
    value: ${{ steps.run.outputs.json }}

runs:
  using: composite
  steps:
    # Phase 3（署名バイナリの配布）までは、uses: に書いたタグのソースからビルドする。
    - name: Cache releasectl build
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ${{ runner.temp }}/releasectl-target
        key: releasectl-${{ runner.os }}-${{ github.action_ref || github.sha }}
        restore-keys: releasectl-${{ runner.os }}-

    - name: Install releasectl
      shell: bash
      env:
        CARGO_TARGET_DIR: ${{ runner.temp }}/releasectl-target
      run: |
        set -euo pipefail
        rustup toolchain install stable --profile minimal --no-self-update >/dev/null
        cargo +stable install --locked --quiet --path "$GITHUB_ACTION_PATH/crates/cli" --root "$RUNNER_TEMP/releasectl"
        echo "$RUNNER_TEMP/releasectl/bin" >> "$GITHUB_PATH"

    - name: releasectl ${{ inputs.command }}
      id: run
      shell: bash
      env:
        RC_COMMAND: ${{ inputs.command }}
        RC_CONFIG: ${{ inputs.config }}
        RC_ONLY: ${{ inputs.only }}
      run: |
        set -uo pipefail
        case "$RC_COMMAND" in
          iap-plan|iap-apply|iap-retire-plan|iap-retire) sub=(iap "${RC_COMMAND#iap-}") ;;
          meta-plan|meta-apply) sub=(meta "${RC_COMMAND#meta-}") ;;
          plan|apply|retire-plan|retire)
            echo "::error::command: $RC_COMMAND は v0.6.0 から iap-$RC_COMMAND になりました（meta-plan と同じ書き方）"; exit 1 ;;
          *) echo "::error::unknown command: $RC_COMMAND"; exit 1 ;;
        esac
        json="$RUNNER_TEMP/releasectl.json"; md="$RUNNER_TEMP/releasectl.md"
        args=("${sub[@]}" --config "$RC_CONFIG" --detailed-exitcode --json-out "$json" --markdown-out "$md")
        [ -n "$RC_ONLY" ] && args+=(--only "$RC_ONLY")
        # 鍵は env のまま CLI に渡す。ここでは触らない・ログに出さない。
        # Actions の bash は -e 付きで起動する。差分あり（2）で止まらないよう終了コードを受け取る。
        code=0
        releasectl "${args[@]}" || code=$?
        [ -f "$md" ] && cat "$md" >> "$GITHUB_STEP_SUMMARY"
        echo "exitcode=$code" >> "$GITHUB_OUTPUT"
        echo "has-changes=$([ "$code" = 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        echo "json=$json" >> "$GITHUB_OUTPUT"
        echo "markdown=$md" >> "$GITHUB_OUTPUT"
        # 差分あり（2）は成功。エラー（1）だけ失敗にする。コメントは失敗しても付けたいので後で落とす。
        exit 0

    - name: Comment on the pull request
      # PR と push のときだけ（定期実行で main の最新 commit の PR にコメントしないように）
      if: inputs.comment == 'true' && steps.run.outputs.markdown != '' && (github.event_name == 'pull_request' || github.event_name == 'push')
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        RC_COMMAND: ${{ inputs.command }}
        RC_MD: ${{ steps.run.outputs.markdown }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        [ -f "$RC_MD" ] || exit 0
        repo="$GITHUB_REPOSITORY"
        marker="<!-- releasectl:$RC_COMMAND -->"
        if [ -n "${PR_NUMBER:-}" ]; then
          # PR: 印の付いたコメントを 1 つだけ持ち、書き換える（sticky）
          id=$(gh api "repos/$repo/issues/$PR_NUMBER/comments" --paginate \
                 --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$repo/issues/comments/$id" -F body=@"$RC_MD" >/dev/null
          else
            gh api -X POST "repos/$repo/issues/$PR_NUMBER/comments" -F body=@"$RC_MD" >/dev/null
          fi
        else
          # push: その commit を含む PR に結果を付ける（無ければ job summary だけ）
          pr=$(gh api "repos/$repo/commits/$GITHUB_SHA/pulls" --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "$pr" ]; then
            gh api -X POST "repos/$repo/issues/$pr/comments" -F body=@"$RC_MD" >/dev/null
          fi
        fi

    - name: Drift issue
      if: inputs.drift-issue == 'true' && (inputs.command == 'iap-plan' || inputs.command == 'meta-plan') && (steps.run.outputs.exitcode == '0' || steps.run.outputs.exitcode == '2')
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        RC_CONFIG: ${{ inputs.config }}
        RC_MD: ${{ steps.run.outputs.markdown }}
        RC_CODE: ${{ steps.run.outputs.exitcode }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail
        repo="$GITHUB_REPOSITORY"
        label=releasectl-drift
        marker="<!-- releasectl:drift:$RC_CONFIG -->"
        issue=$(gh issue list -R "$repo" --state open --label "$label" --limit 100 --json number,body \
                  --jq "map(select(.body | startswith(\"$marker\"))) | .[0].number // empty" 2>/dev/null || true)

        if [ "$RC_CODE" = 0 ]; then
          if [ -n "$issue" ]; then
            gh issue comment "$issue" -R "$repo" --body "✅ 解消しました（plan が差分なし）: $RUN_URL" >/dev/null
            gh issue close "$issue" -R "$repo" >/dev/null
            echo "drift issue #$issue を閉じた"
          fi
          exit 0
        fi

        # 本文 = 印 + plan の Markdown（先頭の plan の印は除く）。末尾の「検出:」は比較から外す。
        content="$RUNNER_TEMP/drift-content.md"; body="$RUNNER_TEMP/drift-body.md"
        { echo "$marker"; tail -n +2 "$RC_MD"; } > "$content"
        { cat "$content"; echo; echo "---"; echo "検出: $RUN_URL（$(date -u +%Y-%m-%dT%H:%MZ)）"; } > "$body"

        if [ -z "$issue" ]; then
          gh label create "$label" -R "$repo" --color D93F0B --description "releasectl: ストアのカタログが desired-state とずれている" --force >/dev/null
          url=$(gh issue create -R "$repo" --title "releasectl: ストアのカタログが $RC_CONFIG とずれています" --label "$label" --body-file "$body")
          echo "drift issue を開いた: $url"
          exit 0
        fi
        old="$RUNNER_TEMP/drift-old.md"
        gh issue view "$issue" -R "$repo" --json body --jq .body | sed '/^---$/,$d' > "$old"
        # 末尾の空行の違いは無視して比べる
        if diff -q <(sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' "$old") <(sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' "$content") >/dev/null; then
          echo "drift issue #$issue: 内容は前回と同じ（何もしない）"
        else
          gh issue edit "$issue" -R "$repo" --body-file "$body" >/dev/null
          gh issue comment "$issue" -R "$repo" --body "🔄 ドリフトの内容が変わりました: $RUN_URL" >/dev/null
          echo "drift issue #$issue を更新した"
        fi

    - name: Fail on error
      if: steps.run.outputs.exitcode == '1'
      shell: bash
      run: |
        echo "::error::releasectl ${{ inputs.command }} reported errors (see the job summary)"
        exit 1
