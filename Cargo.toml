[workspace]
resolver = "3"
members = ["crates/core", "crates/stores", "crates/cli"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
releasectl-core = { path = "crates/core" }
releasectl-stores = { path = "crates/stores" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
thiserror = "2"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "form", "default-tls"] }
jsonwebtoken = { version = "11", default-features = false, features = ["use_pem", "aws_lc_rs"] }
clap = { version = "4", features = ["derive"] }
urlencoding = "2"
base64 = "0.22"

[profile.release]
strip = true
lto = "thin"
